aid: ordercircle
name: OrderCircle
description: OrderCircle is a B2B wholesale order management software platform, founded in 2015 in San
  Francisco, that gives fast-growing brands one system to automate wholesale orders, track inventory in
  real time, generate invoices, and run a self-service B2B eCommerce portal for their buyers. It targets
  wholesale operations in apparel, coffee, jewelry, food and beverage, hemp, vape, and CBD, and connects
  to existing tools through pre-built integrations with Shopify, WooCommerce, QuickBooks, Xero, ShipStation,
  Stripe, Square, PayPal PayFlow, and Authorize.Net. OrderCircle does not currently publish a public
  developer API, developer portal, or API documentation; its programmatic surface is limited to its
  packaged third-party integrations. This profile was seeded as a 500 Global portfolio lead and enriched
  from the company's public web presence.
